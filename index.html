  <style>
    body {
      font-family: 'Tajawal', sans-serif;
    }
    .glass-panel {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .animate-ken-burns {
      animation: kenBurns 18s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.7); }
    }
    .animate-glow {
      animation: pulseGlow 3s infinite;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

    // State Management Variables

    // Initialize Application on Window Load

      renderStoryBars();
      renderCityPills();

    // Render Top Story Progress Bars (21 Steps)

      const container = document.getElementById('story-progress-bars');
      container.innerHTML = slidesData.map((slide, idx) => `
        <div onclick="goToSlide(${idx})" title="${slide.city}" class="h-1.5 rounded-full bg-slate-800 overflow-hidden cursor-pointer">
          <div id="story-bar-${idx}" class="h-full transition-all duration-150 ${
            idx < currentIndex ? 'w-full bg-amber-400' : idx === currentIndex ? 'bg-gradient-to-l from-red-500 to-amber-400' : 'w-0 bg-slate-600'
          }" style="${idx === currentIndex ? `width: ${isAutoPlaying ? currentProgress : 100}%` : ''}"></div>
        </div>
      `).join('');
    }

    // Render Scrollable Day Navigation Pills (21 Steps)
    function renderCityPills() {
      const container = document.getElementById('city-nav-pills');
      container.innerHTML = slidesData.map((slide, idx) => {
        const active = idx === currentIndex;
        return `
          <button
            id="city-pill-${idx}"
            onclick="goToSlide(${idx})"
            class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap transition-all cursor-pointer ${
              active
                ? 'bg-gradient-to-l from-red-600 to-amber-500 text-white shadow-lg shadow-red-600/30 scale-105'
                : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-white/10'
            }"
          >
            <i class="fa-solid ${slide.transportIcon} ${active ? 'text-white' : 'text-amber-400'}"></i>
            <span>${slide.city}</span>
          </button>
        `;
      }).join('');

      const activePill = document.getElementById(`city-pill-${currentIndex}`);
      if (activePill) {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    }

    // Select specific image from gallery thumbnail
    function selectGalleryImage(idx) {
      activeGalleryIdx = idx;
      renderActiveSlide();
    }

    // Navigation Controls
    function nextSlide() {
      currentIndex = (currentIndex + 1) % slidesData.length;
      activeGalleryIdx = 0;
      renderStoryBars();
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;
      activeGalleryIdx = 0;
      renderStoryBars();
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToSlide(idx) {
      currentIndex = idx;
      activeGalleryIdx = 0;
      renderStoryBars();
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Toggle Auto Play Cinematic Mode
    function toggleAutoPlay() {
      isAutoPlaying = !isAutoPlaying;
      const btnIcon = document.getElementById('autoplay-icon');
      const btnText = document.getElementById('autoplay-text');

      if (isAutoPlaying) {
        btnIcon.className = "fa-solid fa-pause";
        btnText.textContent = "إيقاف العرض التلقائي";
        startAutoPlayLoop();
      } else {
        btnIcon.className = "fa-solid fa-play";
        btnText.textContent = "تشغيل العرض التلقائي";
        stopAutoPlayLoop();
      }
    }

    let progressInterval = null;
    function startAutoPlayLoop() {
      currentProgress = 0;
      const intervalMs = 50;
      const increment = (intervalMs / slideDuration) * 100;

      if (progressInterval) clearInterval(progressInterval);

      progressInterval = setInterval(() => {
        if (!isAutoPlaying) {
          clearInterval(progressInterval);
          return;
        }
        currentProgress += increment;
        renderStoryBars();

        if (currentProgress >= 100) {
          currentProgress = 0;
          nextSlide();
        }
      }, intervalMs);
    }

    function stopAutoPlayLoop() {
      if (progressInterval) clearInterval(progressInterval);
      currentProgress = 0;
      renderStoryBars();
    }

    // Toggle Full Schedule Modal View
    function toggleFullSchedule() {
      const modal = document.getElementById('full-schedule-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden') && isAutoPlaying) {
        toggleAutoPlay();
      }
    }

    // Render Full Schedule Cards Grid in Modal
    function renderFullScheduleModalContent() {
      const container = document.getElementById('full-schedule-grid');
      container.innerHTML = slidesData.map((slide, idx) => `
        <div 
          onclick="goToSlide(${idx}); toggleFullSchedule();"
          class="bg-slate-900/90 border border-white/10 hover:border-amber-400/60 rounded-2xl p-4 cursor-pointer transition-all space-y-2 group shadow-lg"
        >
          <div class="flex items-center justify-between">
            <span class="px-2.5 py-1 rounded-full bg-red-600 text-white text-[10px] font-extrabold">
              ${slide.daysBadge}
            </span>
            <span class="text-xs text-amber-400 font-bold group-hover:underline">عرض التفاصيل ←</span>
          </div>
          <h3 class="text-sm font-extrabold text-white group-hover:text-amber-300 transition-colors line-clamp-1">${slide.title}</h3>
          <p class="text-xs text-slate-300 line-clamp-2">${slide.subtitle}</p>
          <div class="pt-2 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
            <span><i class="fa-solid fa-hotel text-amber-400"></i> ${slide.hotelName.split('(')[0]}</span>
            <span class="text-emerald-400 font-bold">${slide.stayCost.split(':')[1] || slide.stayCost}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
