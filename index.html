  <style>
    body {
      font-family: 'Tajawal', sans-serif;
    }
    .glass-panel {
      background: rgba(19, 27, 46, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .animate-ken-burns {
      animation: kenBurns 18s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.7); }
    }
    .animate-glow {
      animation: pulseGlow 3s infinite;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

    let currentIndex = 0;
    let activeGalleryIdx = 0;
    let isAutoPlaying = false;
    let autoPlayTimer = null;
    let currentProgress = 0;
    const slideDuration = 8000;

    window.onload = function() {
      renderCityPills();
      renderActiveSlide();
      renderFullScheduleModalContent();
    };

    function renderCityPills() {
      const container = document.getElementById('city-nav-pills');
      container.innerHTML = slidesData.map((slide, idx) => {
        const active = idx === currentIndex;
        return `
          <button
            id="city-pill-${idx}"
            onclick="goToSlide(${idx})"
            class="flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap transition-all cursor-pointer ${
              active
                ? 'bg-gradient-to-l from-red-600 to-amber-500 text-white shadow-md shadow-red-600/30 scale-105'
                : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-white/10'
            }"
          >
            <i class="fa-solid ${slide.transportIcon} ${active ? 'text-white' : 'text-amber-400'} text-[10px]"></i>
            <span>${slide.city}</span>
          </button>
        `;
      }).join('');

      const activePill = document.getElementById(`city-pill-${currentIndex}`);
      if (activePill) {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function renderActiveSlide() {
      const slide = slidesData[currentIndex];
      const card = document.getElementById('active-slide-card');

        <div class="relative w-full lg:w-7/12 min-h-[300px] sm:min-h-[380px] lg:min-h-full overflow-hidden bg-slate-950 flex flex-col justify-between">

            alt="${slide.title}"

          <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/75"></div>

          <div class="relative z-10 p-3 flex items-center justify-between gap-2 flex-wrap">

              <span>${slide.daysBadge}</span>

            <span class="px-2.5 py-1 rounded-full glass-pill text-amber-300 text-[11px] font-bold flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-red-400 text-xs"></i>
              <span>${slide.locationTag}</span>
            </span>
          </div>

          <div class="relative z-10 p-3 space-y-2 mt-auto">

              <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-black/70 border border-white/15 text-[11px] font-bold text-amber-300">
                <i class="fa-solid fa-camera text-red-400 text-[10px]"></i>
                <span id="main-image-caption">${currentPhoto.label}</span>
              </div>

              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
                ${slide.gallery.map((photo, idx) => `
                  <button
                    id="thumb-btn-${idx}"
                    onclick="selectGalleryImage(${idx})"
                    class="${
                      idx === activeGalleryIdx
                        ? 'relative rounded-lg overflow-hidden border-2 border-amber-400 shadow-lg scale-105 transition-all cursor-pointer h-12 sm:h-14 w-20 sm:w-24 flex-shrink-0'
                        : 'relative rounded-lg overflow-hidden border border-white/25 opacity-75 hover:opacity-100 transition-all cursor-pointer h-12 sm:h-14 w-20 sm:w-24 flex-shrink-0'
                    }"
                  >
                    <img
                      src="${photo.url}"
                      alt="${photo.label}"
                      onerror="this.onerror=null;this.src='${slide.fallbackImage}';"
                      class="w-full h-full object-cover"
                    />
                    <div class="absolute inset-x-0 bottom-0 bg-black/75 px-1 py-0.5 text-[8px] font-bold text-white truncate">
                      ${photo.label}

                <i class="fa-solid fa-hotel text-white text-xs"></i>
              </div>
              <div class="min-w-0">
                <p class="text-[10px] font-bold text-amber-400">الإقامة / الفندق المختار</p>
                <p class="text-xs font-extrabold text-white leading-snug truncate">${slide.hotelName}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="w-full lg:w-5/12 p-3.5 sm:p-5 flex flex-col justify-between bg-[#131B2E] relative">
          <div class="space-y-2.5">
            <div>
              <h2 class="text-sm sm:text-lg font-black text-white leading-snug">${slide.title}</h2>
              <p class="text-slate-300 text-xs mt-0.5 leading-relaxed">${slide.subtitle}</p>
            </div>

            <div class="rounded-xl bg-sky-950/45 border border-sky-500/35 p-2.5 space-y-1">
              <div class="flex items-center gap-1.5 text-xs font-extrabold text-sky-300">
                <i class="fa-solid ${slide.transportIcon} text-amber-400 text-xs"></i>
                <span>${slide.isOverview ? 'مسار التنقل العام وأساليب السفر:' : 'وسيلة التنقل وكيفية الوصول للمعالم:'}</span>
              </div>
              <p class="text-[11px] font-bold text-white">${slide.transport}</p>
              <p class="text-[11px] text-slate-300 leading-relaxed">${slide.howToReach}</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div class="rounded-lg bg-emerald-950/50 border border-emerald-500/30 p-2 flex items-start gap-2">
                <i class="fa-solid fa-ticket text-emerald-400 mt-0.5 text-[10px]"></i>
                <div>
                  <span class="block text-[9px] font-bold text-emerald-300 uppercase">${slide.isOverview ? 'إجمالي التنقل' : 'تكلفة التنقل والتذاكر'}</span>
                  <span class="text-[11px] font-extrabold text-white">${slide.travelCost}</span>
                </div>
              </div>
              <div class="rounded-lg bg-amber-950/50 border border-amber-500/30 p-2 flex items-start gap-2">
                <i class="fa-solid fa-bed text-amber-400 mt-0.5 text-[10px]"></i>
                <div>
                  <span class="block text-[9px] font-bold text-amber-300 uppercase">${slide.isOverview ? 'إجمالي الإقامة (19 ليلة)' : 'تكلفة إقامة الليلة'}</span>
                  <span class="text-[11px] font-extrabold text-white">${slide.stayCost}</span>
                </div>
              </div>
            </div>

            <div class="rounded-xl bg-slate-900/80 border border-white/10 p-2.5 space-y-1">

                <span>${slide.isOverview ? 'توزيع الأيام وأبرز مميزات كل مدينة' : 'أماكن الزيارة والأنشطة في هذا اليوم'}</span>

            </div>

            <div class="rounded-xl bg-gradient-to-br from-red-950/50 to-amber-950/30 border border-amber-500/25 p-2.5 space-y-1">
              <h3 class="text-xs font-extrabold text-amber-300 flex items-center gap-1.5">
                <i class="fa-solid fa-utensils text-amber-400 text-xs"></i>
                <span>${slide.isOverview ? 'أشهر المأكولات والمطاعم' : 'الوجبات والمطاعم المقترحة'}</span>
              </h3>
              <ul class="space-y-1">
                ${slide.meals.map(meal => `
                  <li class="flex items-start gap-1.5 text-[11px] text-amber-100/90 leading-relaxed">
                    <i class="fa-solid fa-bowl-rice text-red-400 mt-0.5 text-[10px] flex-shrink-0"></i>
                    <span>${meal}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <div class="mt-2 pt-2 border-t border-white/10 flex items-start gap-1.5 text-[11px] text-slate-300">
            <i class="fa-solid fa-lightbulb text-amber-400 text-xs mt-0.5 flex-shrink-0"></i>
            <p><strong class="text-amber-300">نصيحة المخطط:</strong> ${slide.highlightNote}</p>
          </div>
        </div>
      `;
    }

    function selectGalleryImage(idx) {
      activeGalleryIdx = idx;
      renderActiveSlide();
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slidesData.length;
      activeGalleryIdx = 0;
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;
      activeGalleryIdx = 0;
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToSlide(idx) {
      currentIndex = idx;
      activeGalleryIdx = 0;
      renderCityPills();
      renderActiveSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleAutoPlay() {
      isAutoPlaying = !isAutoPlaying;
      const btnIcon = document.getElementById('autoplay-icon');
      const btnText = document.getElementById('autoplay-text');

      if (isAutoPlaying) {
        btnIcon.className = "fa-solid fa-pause text-[9px]";
        btnText.textContent = "إيقاف العرض";
        startAutoPlayLoop();
      } else {
        btnIcon.className = "fa-solid fa-play text-[9px]";
        btnText.textContent = "تشغيل العرض التلقائي";
        stopAutoPlayLoop();
      }
    }

    let progressInterval = null;
    function startAutoPlayLoop() {
      const intervalMs = 50;
      if (progressInterval) clearInterval(progressInterval);

      progressInterval = setInterval(() => {
        if (!isAutoPlaying) {
          clearInterval(progressInterval);
          return;
        }
        currentProgress += (intervalMs / slideDuration) * 100;
        if (currentProgress >= 100) {
          currentProgress = 0;
          nextSlide();
        }
      }, intervalMs);
    }

    function toggleFullSchedule() {
      const modal = document.getElementById('full-schedule-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden') && isAutoPlaying) {
        toggleAutoPlay();
      }
    }

    function renderFullScheduleModalContent() {
      const container = document.getElementById('full-schedule-grid');
      container.innerHTML = slidesData.map((slide, idx) => `
        <div 
          onclick="goToSlide(${idx}); toggleFullSchedule();"
          class="bg-slate-900/90 border border-white/10 hover:border-amber-400/60 rounded-xl p-3 cursor-pointer transition-all space-y-1.5 group shadow-md"
        >
          <div class="flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-full bg-red-600 text-white text-[9px] font-extrabold">
              ${slide.daysBadge}
            </span>
            <span class="text-[11px] text-amber-400 font-bold group-hover:underline">عرض التفاصيل ←</span>
          </div>
          <h3 class="text-xs font-extrabold text-white group-hover:text-amber-300 transition-colors line-clamp-1">${slide.title}</h3>
          <p class="text-[11px] text-slate-300 line-clamp-2">${slide.subtitle}</p>
          <div class="pt-1.5 border-t border-white/10 flex items-center justify-between text-[10px] text-slate-400">
            <span><i class="fa-solid fa-hotel text-amber-400"></i> ${slide.hotelName.split('(')[0]}</span>
            <span class="text-emerald-400 font-bold">${slide.stayCost.split(':')[1] || slide.stayCost}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
